<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Nau Quero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500&family=League+Spartan:wght@300;400;500;600&family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Light.otf') format('opentype'); font-weight:300; font-style:normal; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Italic.otf') format('opentype'); font-weight:400; font-style:italic; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Bold.otf') format('opentype'); font-weight:500 700; font-style:normal; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  body { margin:0; background:#391D01; overflow:hidden; }
  a { color:#F3E9D2; }
  a:hover { color:#D5DB89; }
  @keyframes nqNudge { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  @keyframes nqSpin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
</style>
</helmet>
<div style="position:relative; font-family:'League Spartan',sans-serif; background:#391D01; color:#F3E9D2; height:100vh; height:100svh; min-height:480px; overflow:hidden;">
  <div style="position:absolute; inset:0; z-index:30; pointer-events:none; background:#F3E9D2; opacity:{{ veilOpacity }}; transition:opacity 1.4s ease .6s;"></div>
  <div ref="{{ stage }}" style="position:absolute; inset:0; cursor:grab; touch-action:none;"></div>

  <div style="position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0.16; background-image:url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%272.6%27%20numOctaves%3D%272%27%20seed%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.96%200%200%200%200%200.88%200%200%200%200%200.72%2012%200%200%200%20-7.4399999999999995%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E&quot;), url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%272.4%27%20numOctaves%3D%272%27%20seed%3D%2711%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.08%200%200%200%200%200.03%200%200%200%200%200%2012%200%200%200%20-7.5600000000000005%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E&quot;), url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%273.5%27%20numOctaves%3D%272%27%20seed%3D%277%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.9%200%200%200%200%200.78%200%200%200%200%200.58%208%200%200%200%20-4.8%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E&quot;); background-size:300px 300px, 340px 340px, 260px 260px;"></div>

  <div style="position:absolute; left:50%; top:50%; z-index:11; transform:translate(-50%,-50%);">
    <button type="button" onClick="{{ enter }}" style="pointer-events:auto; background:transparent; border:0; padding:12px 16px; cursor:pointer; color:#F3E9D2; font-family:'The Seasons','Petrona',Georgia,serif; font-style:italic; font-size:clamp(15px,1.3vw,19px); letter-spacing:0.01em; line-height:1; opacity:{{ enterOpacity }}; transition:opacity .9s ease;">Entra</button>
  </div>

  <div style="position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(20px,3vw,44px) clamp(20px,5vw,72px);">
    <div style="display:flex; align-items:flex-start; justify-content:flex-end; gap:18px;">
      <img src="./images/nauquero-logo-brown.png" alt="NAU QUERO" style="height:clamp(20px,1.9vw,28px); width:auto; display:block; filter:brightness(0) invert(1) sepia(0.25) brightness(0.96);"></img>
    </div>

    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap;">
      <h1 style="font-family:'The Seasons','Petrona',Georgia,serif; font-weight:400; font-size:clamp(26px,5.6vw,84px); line-height:0.92; letter-spacing:-0.04em; margin:0; padding:0.3em 0;">We don<span style="font-family:'Petrona',Georgia,serif;">’</span>t do<br></br><span style="font-style:italic; color:#D5DB89;">vanilla.</span></h1>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sound: true, diving: false };

  componentDidMount() {
    import('./swirl.js').then(m => {
      if (this._host) this._swirl = m.initSwirl(this._host);
      if (this._swirl && this.state.sound) this._swirl.setSound(true);
    });
    // browsers block audio until a gesture — pick up the first one
    this._kick = () => { if (this.state.sound && this._swirl) this._swirl.setSound(true); };
    ['pointerdown', 'keydown', 'pointermove'].forEach(e => window.addEventListener(e, this._kick, { once: false }));
    import('./dot-cursor.js').then(m => { this._dot = m.initDotCursor(); });
  }
  componentWillUnmount() {
    if (this._kick) ['pointerdown', 'keydown', 'pointermove'].forEach(e => window.removeEventListener(e, this._kick));
    if (this._swirl) this._swirl.destroy();
    if (this._dot) this._dot();
  }

  renderVals() {
    const diving = this.state.diving;
    return {
      stage: el => { this._host = el; },
      ringOpacity: diving ? 0 : 1,
      enterOpacity: diving ? 0 : 1,
      veilOpacity: diving ? 1 : 0,
      enter: () => {
        if (this.state.diving) return;
        this.setState({ diving: true });
        const go = () => { setTimeout(() => { if (this._swirl) this._swirl.destroy(); window.location.href = './home.html'; }, 950); };
        if (this._swirl) this._swirl.dive(go); else go();
      },
    };
  }
}
</script>
</body>
</html>
